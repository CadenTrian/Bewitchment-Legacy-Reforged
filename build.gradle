// Avoid first-load Forge/Curios correction racing NightConfig's watcher on Windows.
// Existing developer defaults and world-specific settings remain untouched.
tasks.register('prepareDevServerDefaults') {
    doLast {
        ['curios-server.toml', 'forge-server.toml'].each { name ->
            def destination = file("run/defaultconfigs/${name}")
            if (!destination.exists()) {
                destination.parentFile.mkdirs()
                java.nio.file.Files.copy(file("config/dev-defaultconfigs/${name}").toPath(), destination.toPath())
            }
        }
    }
}
tasks.matching { it.name in ['runClient', 'prepareRunClient', 'runServer', 'prepareRunServer'] }.configureEach {
    dependsOn tasks.named('prepareDevServerDefaults')
}
